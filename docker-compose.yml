services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-container
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10


  ollama-init:
    container_name: ollama-init-container
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL}"]
    restart: "no"

  ai-developer:
    build:
      context: ./ai-developer
      dockerfile: Dockerfile
    container_name: ai-developer-container
    environment:
      - OLLAMA_HOST
      - OLLAMA_MODEL
      - OLLAMA_CODER
      - OUTPUT_DIR
      - PYTHONIOENCODING=utf-8
      - LANGSMITH_API_KEY
      - GOOGLE_API_KEY
    volumes:
      - ./output:/output
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
