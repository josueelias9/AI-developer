[project]
name = "my-app-langgraph"
version = "0.1.0"
description = "LangGraph app package for ai-developer"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-ollama",
    "langgraph",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["my_agent*"]
